trainer:
  _target_: pytorch_lightning.Trainer

  max_epochs: 6000
  log_every_n_steps: 1
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 1
  accelerator: gpu
  devices: 1

  callbacks:
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      filename: latest-{epoch}
      every_n_epochs: 1
      save_top_k: 1
      save_last: true
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      filename: latest-{epoch}
      monitor: step
      mode: max
      every_n_epochs: 500
      save_top_k: -1
      save_last: false
    - _target_: src.callback.progress.ProgressLogger
      precision: 3
    - _target_: src.callback.tqdmbar.TQDMProgressBar
    - _target_: src.callback.eval_in_training.EvalInTraining
      # Off by default. Flip enabled=true (CLI: +trainer.callbacks.3.enabled=true)
      # to track Per-action / Per-seq / Avg-part R@1 + FID across training. The
      # callback spawns eval_part.py + src.eval.run + src.eval.paper_table as
      # subprocesses every `every_n_epochs`, so a failure can't kill training.
      enabled: false
      every_n_epochs: 200
      num_turns: 1
      split: val
      device: cuda
      protocols: ["guo", "guo+threshold"]
      dataset_name: frankenstein-dataset
      eval_model_dir: pretrained/eval_model
      annotations_root: datasets/annotations
      max_runtime_seconds: 7200

  logger:
    - _target_: src.logger.csv.CSVLogger
      save_dir: ${run_dir}
      name: logs

