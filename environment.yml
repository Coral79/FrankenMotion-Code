name: frankenmotion
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - ffmpeg
  - pip
  - pip:
      # PyTorch ships from a CUDA-specific wheel index. Default is CUDA 11.8;
      # change the URL below for CPU or another CUDA build (see https://pytorch.org/get-started/locally/).
      - --extra-index-url https://download.pytorch.org/whl/cu118

      # PyTorch + CUDA runtime
      - torch==2.5.1+cu118
      - torchvision==0.20.1+cu118
      - triton==3.1.0
      - nvidia-cublas-cu11==11.11.3.6
      - nvidia-cublas-cu12==12.1.3.1
      - nvidia-cuda-cupti-cu11==11.8.87
      - nvidia-cuda-cupti-cu12==12.1.105
      - nvidia-cuda-nvrtc-cu11==11.8.89
      - nvidia-cuda-nvrtc-cu12==12.1.105
      - nvidia-cuda-runtime-cu11==11.8.89
      - nvidia-cuda-runtime-cu12==12.1.105
      - nvidia-cudnn-cu11==9.1.0.70
      - nvidia-cudnn-cu12==9.1.0.70
      - nvidia-cufft-cu11==10.9.0.58
      - nvidia-cufft-cu12==11.0.2.54
      - nvidia-curand-cu11==10.3.0.86
      - nvidia-curand-cu12==10.3.2.106
      - nvidia-cusolver-cu11==11.4.1.48
      - nvidia-cusolver-cu12==11.4.5.107
      - nvidia-cusparse-cu11==11.7.5.86
      - nvidia-cusparse-cu12==12.1.0.106
      - nvidia-nccl-cu11==2.21.5
      - nvidia-nccl-cu12==2.20.5
      - nvidia-nvjitlink-cu12==12.6.85
      - nvidia-nvtx-cu11==11.8.86
      - nvidia-nvtx-cu12==12.1.105
      - mkl-service==2.5.2

      # Lightning / Hydra training & config stack
      - pytorch-lightning==2.0.9
      - lightning-utilities==0.9.0
      - torchmetrics==1.1.2
      - hydra-core==1.3.2
      - hydra-colorlog==1.2.0
      - colorlog==6.7.0
      - omegaconf==2.3.0
      - antlr4-python3-runtime==4.9.3

      # Modelling
      - diffusers==0.33.1
      - transformers==4.57.6
      - rotary-embedding-torch==0.8.6
      - huggingface-hub==0.36.0
      - einops==0.8.1
      - eval_type_backport==0.2.2

      # Data / numerics
      - numpy==1.24.1
      - scipy==1.11.2
      - pandas==1.3.5
      - scikit-learn==1.3.1
      - scikit-image==0.22.0
      - scikit-video==1.1.11
      - regex==2023.8.8
      - tqdm==4.65.2
      - orjson==3.9.7
      - PyYAML==6.0.1
      - packaging==23.1
      - lazy_loader==0.3
      - multipledispatch==1.0.0
      - termcolor==2.3.0
      - wcwidth==0.2.6
      - ftfy==6.1.1
      - semantic-version==2.10.0
      - pytz==2023.3.post1

      # Image / video / 3D rendering
      - matplotlib==3.4.3
      - Pillow==10.0.1
      - imageio==2.31.5
      - imageio-ffmpeg==0.4.9
      - moviepy==1.0.3
      - proglog==0.1.10
      - opencv-python==4.5.5.64
      - opencv-contrib-python-headless==4.8.1.78
      - pyrender==0.1.45
      - PyOpenGL==3.1.0
      - trimesh==3.23.5

      # SMPL
      - smplx==0.1.28
      - chumpy==0.70

      # Misc helpers used by the codebase / FrankenAgent
      - ffmpy==0.3.1
      - pydub==0.25.1
      - roma==1.4.1

      # OpenAI CLIP (not on PyPI — installed from the GitHub commit).
      - git+https://github.com/openai/CLIP.git@a1d071733d7111c9c014f024669f959182114e33
